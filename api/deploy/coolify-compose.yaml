services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "5050:5050"
    env_file:
      - ../.env
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5050/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
