name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  api:
    name: API Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: battleasia-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: battleasia-api/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm audit --audit-level=high
        continue-on-error: true

  fe:
    name: FE Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: battleasia-fe-main/battleasia-fe-main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: battleasia-fe-main/battleasia-fe-main/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_SERVER_URL: ""

  shop:
    name: Shop Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: battleasia-shop-main/battleasia-shop-main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: battleasia-shop-main/battleasia-shop-main/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_SERVER_URL: http://localhost:5050

  admin:
    name: Admin Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: battleasia-admin-main/battleasia-admin-main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: battleasia-admin-main/battleasia-admin-main/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run build
        env:
          CI: false
          REACT_APP_API_URL: http://localhost:5050
