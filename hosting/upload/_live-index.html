          window.addEventListener('error', function(event) {

    <!-- Admin Quick Switch Button -->
    <a href="#" id="adminQuickBtn" style="display:none;position:fixed;bottom:20px;right:20px;z-index:9999;background:#1a1a2e;color:#fff;padding:12px 20px;border-radius:50px;text-decoration:none;font-family:sans-serif;font-size:14px;font-weight:600;box-shadow:4px 12px rgba(0,0,0,0.4);border:1px solid #333;transition:all .2s;cursor:pointer;" onclick="event.preventDefault();this.textContent='⏳ Switching...';this.style.opacity='0.6';syncToAdmin();" onmouseover="this.style.transform='scale(1.05)';this.style.background='#e94560'" onmouseout="this.style.transform='scale(1)';this.style.background='#1a1a2e'">⚙️ Go to Admin Panel</a>
    <script>
    function syncToAdmin(){
      try{
        var raw = localStorage.getItem('persist:battleasia');
        if(raw){
          var data = JSON.parse(raw);
          var auth = data.auth;
          if(typeof auth === 'string') auth = JSON.parse(auth);
          if(!auth) return;
          var token = auth.token || auth.accessToken || '';
          var user = auth.user || {};
          var adminAuth = JSON.stringify({
            token: token,
            user: user,
            isLoggedIn: true,
            isInitialized: true,
            balance: auth.balance || 0
          });
          localStorage.setItem('persist:webet', JSON.stringify({
            auth: adminAuth,
            _persist: JSON.stringify({version: -1, rehydrated: true})
          }));
        }
      }catch(e){}
      window.location.href = '/admin/';
    }
    (function(){
      function checkAdmin(){
        try{
          var raw = localStorage.getItem('persist:battleasia') || localStorage.getItem('battleasia');
          if(!raw) return;
          var data = JSON.parse(raw);
          if(!data) return;
          var auth = data.auth;
          if(typeof auth === 'string') auth = JSON.parse(auth);
          if(!auth) return;
          var user = auth.user;
          if(!user) return;
          var role = user.role || user.roleName || '';
          var roleType = '';
          if(role && typeof role === 'object') roleType = role.type || '';
          var isAdmin = roleType === 'admin' || role === 'Admin' || user.roleName === 'Admin';
          document.getElementById('adminQuickBtn').style.display = isAdmin ? 'block' : 'none';
        }catch(e){}
      }
      setInterval(checkAdmin, 200);
      checkAdmin();
      window.addEventListener('storage', checkAdmin);
    })();
    </script>
