<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BattleAsia Stat Tile Demos</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #0a0a0a;
      color: #e5e5e5;
      padding: 24px;
    }
    h1 {
      font-size: 1.35rem;
      font-weight: 700;
      margin: 0 0 6px;
      color: #f5c518;
    }
    p {
      margin: 0 0 24px;
      color: #9ca3af;
      font-size: 0.92rem;
      line-height: 1.5;
    }
    .grid {
      display: grid;
      gap: 20px;
      max-width: 1100px;
    }
    figure {
      margin: 0;
      background: #111;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      overflow: hidden;
    }
    figcaption {
      padding: 12px 14px;
      font-size: 0.85rem;
      border-top: 1px solid rgba(255,255,255,0.06);
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    figcaption strong { color: #fff; }
    figcaption span { color: #9ca3af; }
    img {
      display: block;
      width: 100%;
      height: auto;
      background: #000;
    }
    .pick {
      margin-top: 28px;
      padding: 14px 16px;
      border: 1px solid rgba(245,197,24,0.25);
      border-radius: 8px;
      background: rgba(245,197,24,0.06);
      font-size: 0.9rem;
      max-width: 1100px;
    }
  </style>
</head>
<body>
  <h1>Stat tile / button demos</h1>
  <p>Pick one style (1–5). Reply in chat with the number and we will apply it site-wide + APK.</p>

  <div class="grid">
    <figure>
      <img src="./demo-1-midnight.png" alt="Demo 1 Midnight Grid" />
      <figcaption><strong>Demo 1 — Midnight Grid</strong><span>Dark tile + thin gold top line (recommended)</span></figcaption>
    </figure>
    <figure>
      <img src="./demo-2-gold-frame.png" alt="Demo 2 Gold Frame" />
      <figcaption><strong>Demo 2 — Gold Frame</strong><span>Full gold border + corner accent</span></figcaption>
    </figure>
    <figure>
      <img src="./demo-3-flat-bar.png" alt="Demo 3 Flat Gold Bar" />
      <figcaption><strong>Demo 3 — Flat Gold Bar</strong><span>Solid top bar, zero glow</span></figcaption>
    </figure>
    <figure>
      <img src="./demo-4-frost.png" alt="Demo 4 Frost Glass" />
      <figcaption><strong>Demo 4 — Frost Glass</strong><span>Glass blur + gold dot label</span></figcaption>
    </figure>
    <figure>
      <img src="./demo-5-sharp.png" alt="Demo 5 Sharp Square" />
      <figcaption><strong>Demo 5 — Sharp Square</strong><span>0px corner + left gold stripe</span></figcaption>
    </figure>
  </div>

  <div class="pick">Tip: Right-click any image → Open in New Tab for full size.</div>
</body>
</html>
