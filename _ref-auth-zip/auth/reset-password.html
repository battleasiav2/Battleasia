<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#060607" />
<title>Reset Password — BattleAsia 2.0</title>
<link rel="icon" href="../favicon.ico" />
<link rel="preconnect" href="https://api.fontshare.com" crossorigin />
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600,700&f[]=satoshi@400,500,700,900&display=swap" />
<script>document.documentElement.classList.add("js")</script>
<link rel="stylesheet" href="../styles.css?v=8" />
<link rel="stylesheet" href="../auth.css?v=1" />
</head>
<body class="auth-body" data-auth-page="reset">
<div class="grain" aria-hidden="true"></div>

<header class="site-header scrolled" id="siteHeader">
  <div class="wrap header-inner">
    <a class="brand-lockup" href="../index.html" aria-label="BattleAsia 2.0 home">
      <img class="brand-crest" src="../assets/logo.png" alt="" width="40" height="40" />
      <span class="brand-word">BATTLE<span class="gold">ASIA</span><sup>2.0</sup></span>
    </a>
    <div class="header-actions">
      <div class="popover">
        <button class="lang-pill" aria-haspopup="listbox" aria-expanded="false" aria-label="Change language">
          <span id="langCode">EN</span>
          <svg class="caret" viewBox="0 0 12 12" width="10" height="10" aria-hidden="true"><path d="M2 4l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
        <div class="popover-menu" role="listbox" hidden>
          <button class="is-active" data-lang="EN">English</button>
          <button data-lang="BN">বাংলা</button>
        </div>
      </div>
      <div class="popover">
        <button class="accent-btn" aria-haspopup="true" aria-expanded="false" aria-label="Change accent color">
          <span class="accent-swatch"></span>
        </button>
        <div class="popover-menu accent-menu" hidden>
          <button data-accent="lime" class="is-active" aria-label="Lime"><i style="background:#cbfb24"></i></button>
          <button data-accent="gold" aria-label="Gold"><i style="background:#f5c518"></i></button>
          <button data-accent="ember" aria-label="Ember"><i style="background:#ff8a1a"></i></button>
          <button data-accent="jade" aria-label="Jade"><i style="background:#3dff8a"></i></button>
          <button data-accent="cyan" aria-label="Cyan"><i style="background:#22d3ee"></i></button>
          <button data-accent="sky" aria-label="Sky"><i style="background:#60a5fa"></i></button>
        </div>
      </div>
    </div>
  </div>
  <div class="header-hairline" aria-hidden="true"></div>
</header>

<main class="auth-split">
  <section class="auth-form-col">
    <div class="auth-form-wrap">
      <div class="auth-card">
        <div class="auth-progress" aria-hidden="true"><i style="width:100%"></i></div>
        <div class="auth-card-inner">
          <div class="auth-brand">
            <img class="auth-logo" src="../assets/logo.png" alt="BattleAsia" width="104" height="104" />
            <span class="auth-brand-rule" aria-hidden="true"></span>
            <p class="auth-tagline" data-i18n="auth.brandTagline">PUBG MOBILE TOURNAMENTS</p>
            <h1 class="auth-title" data-i18n="auth.resetYourPassword">Reset your password</h1>
            <p class="auth-desc" data-i18n="auth.resetPasswordDescription">Enter your email address and we'll send you a link to reset your password.</p>
          </div>

          <div id="authAlert" class="auth-alert" hidden role="alert"></div>

          <form id="authForm" class="auth-fields" novalidate>
            <div>
              <label class="auth-label" for="email" data-i18n="auth.emailAddress">Email address</label>
              <div class="auth-input-wrap" data-wrap="email">
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.7" d="M4 6h16v12H4z"/><path fill="none" stroke="currentColor" stroke-width="1.7" d="m4 7 8 6 8-6"/></svg>
                <input id="email" name="email" type="email" autocomplete="email" required data-i18n="auth.emailPlaceholder" data-i18n-placeholder placeholder="Example@domain.com" />
              </div>
              <span class="auth-field-error" data-error-for="email"></span>
            </div>

            <div>
              <label class="auth-label" for="code" data-i18n="auth.verificationCode6Digits">Verification Code (6 digits)</label>
              <div class="auth-input-wrap auth-code" data-wrap="code">
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/><path fill="none" stroke="currentColor" stroke-width="1.7" d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
                <input id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="\d{6}" required data-i18n="auth.enter6DigitCode" data-i18n-placeholder placeholder="Enter 6-digit code" />
              </div>
              <span class="auth-field-error" data-error-for="code"></span>
            </div>

            <button class="btn btn-primary auth-submit" type="button" id="verifyCodeBtn">
              <span data-i18n="auth.verifyCode">Verify Code</span>
            </button>

            <div id="resetPassBlock" class="auth-stack" hidden>
              <div>
                <label class="auth-label" for="newPassword" data-i18n="auth.newPassword">New Password</label>
                <div class="auth-input-wrap" data-wrap="newPassword">
                  <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/><path fill="none" stroke="currentColor" stroke-width="1.7" d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
                  <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" minlength="8" data-i18n="auth.passwordPlaceholder" data-i18n-placeholder placeholder="8+ characters" />
                  <button class="auth-toggle-pass" type="button" data-toggle-pass="newPassword" aria-label="Show password">
                    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.7" d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>
                  </button>
                </div>
                <span class="auth-field-error" data-error-for="newPassword"></span>
              </div>
              <div>
                <label class="auth-label" for="confirmPassword" data-i18n="auth.confirmPassword">Confirm Password</label>
                <div class="auth-input-wrap" data-wrap="confirmPassword">
                  <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/><path fill="none" stroke="currentColor" stroke-width="1.7" d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
                  <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" data-i18n="auth.confirmYourPassword" data-i18n-placeholder placeholder="Confirm your password" />
                  <button class="auth-toggle-pass" type="button" data-toggle-pass="confirmPassword" aria-label="Show password">
                    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.7" d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>
                  </button>
                </div>
                <span class="auth-field-error" data-error-for="confirmPassword"></span>
              </div>
              <button class="btn btn-primary auth-submit" type="submit">
                <span data-i18n="auth.resetPassword">Reset Password</span>
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" d="M5 12h14m0 0-6-6m6 6-6 6"/></svg>
              </button>
            </div>

            <p class="auth-cross">
              <a class="auth-link" href="./sign-in.html" data-i18n="auth.backToSignIn">Back to sign in</a>
            </p>
            <p class="auth-legal">
              <a href="../index.html#rules" data-i18n="auth.termsOfService">Terms of Service</a>
              ·
              <a href="../index.html#rules" data-i18n="auth.privacyPolicy">Privacy Policy</a>
            </p>
          </form>

          <div class="auth-trust">
            <span><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.7" d="M12 3 4 6v6c0 5 3.4 8.4 8 10 4.6-1.6 8-5 8-10V6z"/></svg><span data-i18n="auth.featureSecure">Secure</span></span>
            <span><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.7" d="M7 5h10v4a5 5 0 0 1-10 0V5zm10 1h2.5A2.5 2.5 0 0 1 17 8.5M7 6H4.5A2.5 2.5 0 0 0 7 8.5M8 20h8M12 14v6"/></svg><span data-i18n="auth.featureFairPlay">Fair Play</span></span>
            <span><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/><path fill="none" stroke="currentColor" stroke-width="1.7" d="M16 12h4v4h-4a2 2 0 0 1 0-4z"/></svg><span data-i18n="auth.featureCashPrizes">Cash Prizes</span></span>
          </div>
        </div>
      </div>
    </div>
  </section>

  <aside id="authHero" class="auth-hero" hidden></aside>
</main>

<div id="authToast" class="auth-toast" role="status"></div>
<script src="../auth.js?v=1"></script>
</body>
</html>
