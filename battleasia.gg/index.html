<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <script>
      (function () {
        var palettes = {
          gold: ['#f5c518', '#fbbf24', '#d97706', '#111111', '245, 197, 24'],
          ember: ['#ff8a1a', '#ffb347', '#e05d00', '#111111', '255, 138, 26'],
          jade: ['#34d399', '#6ee7b7', '#059669', '#042f1e', '52, 211, 153'],
          cyan: ['#22d3ee', '#67e8f9', '#0891b2', '#082f38', '34, 211, 238'],
          violet: ['#a78bfa', '#c4b5fd', '#7c3aed', '#1e1038', '167, 139, 250'],
          rose: ['#fb7185', '#fda4af', '#e11d48', '#3f0a14', '251, 113, 133'],
          sky: ['#38bdf8', '#7dd3fc', '#0284c7', '#0b2838', '56, 189, 248'],
        };
        var legacy = { default: 'gold', preset1: 'sky', preset2: 'violet', preset3: 'cyan', preset4: 'ember', preset5: 'rose' };
        var id = 'gold';
        try {
          id = localStorage.getItem('ba-accent') || '';
          if (!palettes[id]) {
            var s = JSON.parse(localStorage.getItem('app-settings') || '{}');
            id = s.primaryColor || 'gold';
          }
        } catch (e) {}
        if (legacy[id]) id = legacy[id];
        var p = palettes[id] || palettes.gold;
        var r = document.documentElement;
        r.style.setProperty('--ba-gold', p[0]);
        r.style.setProperty('--ba-gold-light', p[1]);
        r.style.setProperty('--ba-gold-dark', p[2]);
        r.style.setProperty('--ba-gold-ink', p[3]);
        r.style.setProperty('--ba-gold-rgb', p[4]);
      })();
    </script>
    <meta
      name="description"
      content="BattleAsia — play mobile esports tournaments, win real rewards. PUBG Mobile, Free Fire, COD, Valorant and more."
    />
    <link rel="icon" href="/logo/logo.webp" type="image/webp" />
    <link rel="apple-touch-icon" href="/logo/logo.webp" />
    <link rel="manifest" href="/manifest.json" />

    <!-- LCP: hero image must win the network race before JS (src patched below if restored) -->
    <link
      id="boot-hero-preload"
      rel="preload"
      as="image"
      href="/assets/images/hero/hero-pubg-wide.webp"
      type="image/webp"
      fetchpriority="high"
    />

    <style id="boot-shell-css">
      html,
      body {
        margin: 0;
        background: #000;
      }
      /* Fixed overlay — removing it cannot cause CLS */
      #boot-shell {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        background: #000;
        pointer-events: none;
      }
      #boot-shell img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center center;
        display: block;
      }
      #boot-shell[hidden] {
        display: none !important;
      }
    </style>

    <title>BattleAsia | Mobile Esports Tournaments</title>
  </head>

  <body>
    <!-- Instant LCP paint on home before React boots (fixed → no CLS on dismiss) -->
    <div id="boot-shell" hidden>
      <img
        id="boot-hero-img"
        src="/assets/images/hero/hero-pubg-wide.webp"
        width="1920"
        height="1080"
        alt="BattleAsia"
        fetchpriority="high"
        decoding="sync"
      />
    </div>
    <script>
      (function () {
        var p = location.pathname;
        if (p !== '/' && p !== '/dashboard' && p !== '/dashboard/') return;

        var slides = [
          '/assets/images/hero/hero-pubg-wide.webp',
          '/assets/images/hero/hero-free-fire-wide.webp',
          '/assets/images/hero/hero-cod-mobile-wide.webp',
          '/assets/images/hero/hero-valorant-wide.webp',
          '/assets/images/hero/hero-mobile-legends-wide.webp',
        ];
        var idx = 0;
        try {
          var n = parseInt(sessionStorage.getItem('ba_hero_slide') || '', 10);
          if (!isNaN(n) && n >= 0 && n < slides.length) idx = n;
        } catch (e) {}

        var src = slides[idx];
        var preload = document.getElementById('boot-hero-preload');
        if (preload) preload.setAttribute('href', src);
        var img = document.getElementById('boot-hero-img');
        if (img) img.src = src;

        var el = document.getElementById('boot-shell');
        if (el) el.hidden = false;
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
