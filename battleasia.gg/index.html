<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="BattleAsia — play mobile esports tournaments, win real rewards. PUBG Mobile, Free Fire, COD, Valorant and more."
    />
    <link rel="icon" href="/logo/logo.webp" type="image/webp" />
    <link rel="apple-touch-icon" href="/logo/logo.webp" />

    <!-- LCP: preload ONLY the first hero image (fixed dimensions via width/height on img) -->
    <link
      rel="preload"
      as="image"
      href="/assets/images/hero/hero-pubg-wide.webp"
      type="image/webp"
      fetchpriority="high"
    />
    <link rel="preload" as="image" href="/logo/logo.webp" type="image/webp" />

    <!-- Avoid stale HTML after deploys (hashed assets still cache long-term) -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- Optional API hints — remove if no backend on this package -->
    <link rel="dns-prefetch" href="https://battleasia.gg" />

    <title>BattleAsia | Mobile Esports Tournaments</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
