<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <script>
      (function () {
        var palettes = {
          lime: ['#cbfb24', '#e2ff58', '#9de006', '#081401', '203, 251, 36', '226, 255, 88'],
          gold: ['#f5c518', '#fbbf24', '#d97706', '#111111', '245, 197, 24', '251, 191, 36'],
          ember: ['#ff8a1a', '#ffb347', '#e05d00', '#111111', '255, 138, 26', '255, 179, 71'],
          jade: ['#34d399', '#6ee7b7', '#059669', '#042f1e', '52, 211, 153', '110, 231, 183'],
          cyan: ['#22d3ee', '#67e8f9', '#0891b2', '#082f38', '34, 211, 238', '103, 232, 249'],
          violet: ['#a78bfa', '#c4b5fd', '#7c3aed', '#1e1038', '167, 139, 250', '196, 181, 253'],
          rose: ['#fb7185', '#fda4af', '#e11d48', '#3f0a14', '251, 113, 133', '253, 164, 175'],
          sky: ['#38bdf8', '#7dd3fc', '#0284c7', '#0b2838', '56, 189, 248', '125, 211, 252'],
        };
        var legacy = { default: 'gold', preset1: 'sky', preset2: 'violet', preset3: 'cyan', preset4: 'ember', preset5: 'rose' };
        var id = 'lime';
        try {
          id = localStorage.getItem('ba-accent') || '';
          if (!palettes[id]) {
            var s = JSON.parse(localStorage.getItem('app-settings') || '{}');
            id = s.primaryColor || 'lime';
          }
        } catch (e) {}
        if (legacy[id]) id = legacy[id];
        var p = palettes[id] || palettes.lime;
        var r = document.documentElement;
        r.style.setProperty('--ba-gold', p[0]);
        r.style.setProperty('--ba-gold-light', p[1]);
        r.style.setProperty('--ba-gold-dark', p[2]);
        r.style.setProperty('--ba-gold-ink', p[3]);
        r.style.setProperty('--ba-gold-rgb', p[4]);
        r.style.setProperty('--ba-gold-light-rgb', p[5]);
        r.dataset.accent = id;
      })();
    </script>
    <meta
      name="description"
      content="BattleAsia — play mobile esports tournaments, win real rewards. PUBG Mobile, Free Fire, COD, Valorant and more."
    />
    <link rel="icon" href="/logo/logo.webp" type="image/webp" />
    <link rel="apple-touch-icon" href="/logo/logo.webp" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600,700&f[]=satoshi@400,500,700,900&display=swap"
    />

    <!-- Brand logo preload -->
    <link
      id="boot-logo-preload"
      rel="preload"
      as="image"
      href="/logo/logo.webp"
      type="image/webp"
      fetchpriority="high"
    />

    <style id="boot-shell-css">
      html,
      body {
        margin: 0;
        background: #060607;
      }
      #boot-shell {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        background: #060607;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        font-family: "Satoshi", "Helvetica Neue", sans-serif;
      }
      #boot-shell[hidden] {
        display: none !important;
      }
      .boot-glow {
        position: absolute;
        width: min(520px, 90vw);
        height: min(520px, 90vw);
        border-radius: 50%;
        background: radial-gradient(circle, rgba(var(--ba-gold-rgb, 203,251,36), 0.22) 0%, rgba(var(--ba-gold-rgb, 203,251,36), 0.06) 42%, transparent 70%);
        animation: boot-glow 2.8s ease-in-out infinite;
        pointer-events: none;
      }
      @keyframes boot-glow {
        0%, 100% { opacity: 0.7; transform: scale(0.96); }
        50% { opacity: 1; transform: scale(1.04); }
      }
      #boot-loader-center {
        position: relative;
        z-index: 1;
        width: min(340px, 86vw);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 22px;
      }
      .boot-crest {
        position: relative;
        width: 128px;
        height: 128px;
        display: grid;
        place-items: center;
        animation: boot-float 2.6s ease-in-out infinite;
      }
      @keyframes boot-float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-6px); }
      }
      .boot-crest-ring {
        position: absolute;
        inset: -10px;
        border-radius: 50%;
        border: 1px solid rgba(var(--ba-gold-rgb, 203,251,36), 0.28);
        box-shadow: 0 0 0 1px rgba(255,255,255,0.04), 0 0 40px rgba(var(--ba-gold-rgb, 203,251,36), 0.18);
      }
      .boot-logo-icon {
        width: 112px;
        height: 112px;
        object-fit: contain;
        filter: drop-shadow(0 12px 28px rgba(0,0,0,0.55)) drop-shadow(0 0 18px rgba(var(--ba-gold-rgb, 203,251,36), 0.35));
      }
      .boot-wordmark {
        text-align: center;
        user-select: none;
      }
      .boot-word-battle {
        margin: 0;
        font-family: "Clash Display", "Satoshi", "Barlow", sans-serif;
        font-weight: 700;
        font-size: clamp(1.85rem, 6vw, 2.15rem);
        line-height: 0.9;
        letter-spacing: -0.04em;
        text-transform: uppercase;
        color: #f4f4f1;
      }
      .boot-word-row {
        display: inline-flex;
        align-items: flex-start;
        gap: 8px;
        margin-top: 4px;
      }
      .boot-word-asia {
        font-family: "Clash Display", "Satoshi", "Barlow", sans-serif;
        font-weight: 700;
        font-size: clamp(1.85rem, 6vw, 2.15rem);
        line-height: 0.9;
        letter-spacing: -0.04em;
        text-transform: uppercase;
        color: var(--ba-gold, #cbfb24);
      }
      .boot-ver {
        margin-top: 4px;
        padding: 0.32em 0.58em;
        border-radius: 8px;
        font-family: "Clash Display", "Satoshi", sans-serif;
        font-weight: 700;
        font-size: 0.68rem;
        letter-spacing: 0.14em;
        color: var(--ba-gold-ink, #081401);
        background: linear-gradient(180deg, var(--ba-gold-light, #e2ff58) 0%, var(--ba-gold, #cbfb24) 55%, var(--ba-gold-dark, #9de006) 100%);
        border: 1px solid rgba(255,255,255,0.28);
        box-shadow: 0 3px 0 rgba(0,0,0,0.35), 0 8px 18px -10px rgba(var(--ba-gold-rgb, 203,251,36), 0.55);
      }
      .boot-panel {
        width: 100%;
        margin-top: 4px;
        padding: 14px 16px;
        border-radius: 14px;
        background: rgba(22,22,24,0.55);
        border: 1px solid rgba(255,255,255,0.09);
        box-shadow: 0 20px 50px -30px #000, inset 0 1px 0 rgba(255,255,255,0.05);
      }
      .boot-panel-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
      }
      .boot-panel-label {
        font-size: 0.62rem;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: rgba(244,244,241,0.45);
      }
      #boot-loader-percent {
        font-family: "Clash Display", "Satoshi", sans-serif;
        font-weight: 600;
        font-size: 0.85rem;
        color: #fff;
        font-variant-numeric: tabular-nums;
      }
      .boot-bar-track {
        width: 100%;
        height: 3px;
        border-radius: 2px;
        background: rgba(255,255,255,0.1);
        overflow: hidden;
      }
      #boot-loader-bar {
        height: 100%;
        width: 0%;
        border-radius: 2px;
        background: linear-gradient(90deg, rgba(var(--ba-gold-rgb, 203,251,36), 0.35), var(--ba-gold, #cbfb24));
        box-shadow: 0 0 12px rgba(var(--ba-gold-rgb, 203,251,36), 0.55);
      }
      @media (max-width: 480px) {
        .boot-crest { width: 112px; height: 112px; }
        .boot-logo-icon { width: 96px; height: 96px; }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-glow, .boot-crest { animation: none !important; }
      }
    </style>

    <title>BattleAsia | Mobile Esports Tournaments</title>
  </head>

  <body>
    <!-- Instant first-paint loader — home-matched brand lockup -->
    <div id="boot-shell" hidden>
      <div class="boot-glow" aria-hidden="true"></div>
      <div id="boot-loader-center">
        <div class="boot-crest">
          <div class="boot-crest-ring" aria-hidden="true"></div>
          <img
            class="boot-logo-icon"
            src="/logo/logo.webp"
            alt="BattleAsia"
            width="112"
            height="112"
            fetchpriority="high"
            decoding="sync"
          />
        </div>
        <div class="boot-wordmark">
          <p class="boot-word-battle">Battle</p>
          <div class="boot-word-row">
            <span class="boot-word-asia">Asia</span>
            <span class="boot-ver">2.0</span>
          </div>
        </div>
        <div class="boot-panel">
          <div class="boot-panel-head">
            <span class="boot-panel-label">Entering arena</span>
            <span id="boot-loader-percent">0%</span>
          </div>
          <div class="boot-bar-track">
            <div id="boot-loader-bar"></div>
          </div>
        </div>
      </div>
    </div>
    <script>
      (function () {
        var path = window.location.pathname || '';
        var isHome =
          path === '/' ||
          path === '/index.html' ||
          path === '' ||
          path === '/dashboard';
        var hasShown = false;
        try {
          hasShown = !!sessionStorage.getItem('ba_home_loader_shown');
        } catch (e) {}

        var el = document.getElementById('boot-shell');
        if (!isHome || hasShown) {
          if (el) el.remove();
          return;
        }

        if (el) el.hidden = false;
        var start = Date.now();
        var bar = document.getElementById('boot-loader-bar');
        var pct = document.getElementById('boot-loader-percent');
        function tick() {
          if (!el || el.hasAttribute('hidden') || !document.body.contains(el)) return;
          var elapsed = Date.now() - start;
          var p = Math.min(60, (elapsed / 500) * 60);
          if (bar) bar.style.width = p + '%';
          if (pct) pct.textContent = Math.round(p) + '%';
          if (p < 60) requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
