upstream fe { server fe:80; }
upstream shop { server shop:80; }
upstream admin { server admin:80; }
upstream api { server api:5050; }

gzip on;
gzip_vary on;
gzip_types text/plain text/css application/json application/javascript image/svg+xml;

# HTTP-only bootstrap config — use before SSL certificates exist.
# After running deploy/init-ssl.sh, switch to nginx.prod.conf (see deploy/README.md).

server {
    listen 80;
    server_name battleasia.net www.battleasia.net;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location /api/ {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /uploads/ { proxy_pass http://api; }
    location /socket.io/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
    location / { proxy_pass http://fe; proxy_set_header Host $host; }
}

server {
    listen 80;
    server_name shop.battleasia.net;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location /api/ { proxy_pass http://api; proxy_set_header Host $host; }
    location /uploads/ { proxy_pass http://api; }
    location /socket.io/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    location / { proxy_pass http://shop; proxy_set_header Host $host; }
}

server {
    listen 80;
    server_name admin.battleasia.net;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location /api/ { proxy_pass http://api; proxy_set_header Host $host; }
    location /uploads/ { proxy_pass http://api; }
    location /socket.io/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    location / { proxy_pass http://admin; proxy_set_header Host $host; }
}
