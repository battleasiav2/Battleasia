map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream player_up { server player:80; }
upstream shop_up { server shop:80; }
upstream admin_up { server admin:80; }

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

server {
    listen 80;
    server_name battleasia.gg www.battleasia.gg shop.battleasia.gg admin.battleasia.gg;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name battleasia.gg www.battleasia.gg;

    ssl_certificate /etc/letsencrypt/live/battleasia.gg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/battleasia.gg/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;

    location / {
        proxy_pass http://player_up;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
}

