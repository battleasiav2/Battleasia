# Copy to .github/workflows/deploy-hostinger.yml on GitHub (needs PAT with `workflow` scope).
# Or add manually in GitHub UI: Settings → Actions → New workflow.

name: Deploy to Hostinger (battleasia.gg)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.repository == 'battleasiav2/Battleasia'
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            REPO_DIR="${REPO_DIR:-$HOME/Battleasia}"
            if [ ! -d "$REPO_DIR/.git" ]; then
              git clone https://github.com/battleasiav2/Battleasia.git "$REPO_DIR"
            fi
            cd "$REPO_DIR"
            git fetch origin main
            git reset --hard origin/main
            export MAIN_DOMAIN="https://battleasia.gg"
            bash deploy/deploy.sh
