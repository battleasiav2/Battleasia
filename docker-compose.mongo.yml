# Persistent Mongo only — does not touch Vite ports 8082 / 8083 / 3000.
#   docker compose -f docker-compose.mongo.yml up -d
# Then point API .env:
#   MONGODB_URI=mongodb://127.0.0.1:27018/battleasia?replicaSet=rs0&directConnection=true
#
# Wait until healthy, then restart the host API (tsx watch) so it leaves embedded memory.

name: battleasia-mongo

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - battleasia_mongo:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }",
        ]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 15s

volumes:
  battleasia_mongo:
