name: battleasia_app
description: "BattleAsia Mobile Gaming Tournament Platform - Player Panel"

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.8.1 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # UI & Design
  cupertino_icons: ^1.0.2
  
  # State Management
  provider: ^6.1.1
  
  # Networking
  http: ^1.2.2
  socket_io_client: ^2.0.3+1
  cached_network_image: ^3.4.1
  
  # Local Storage
  shared_preferences: ^2.3.2
  
  # Utils
  intl: ^0.20.2
  url_launcher: ^6.3.1
  intl_phone_field: ^3.2.0
  image_picker: ^1.2.1
  video_player: ^2.9.5
  chewie: ^1.11.3
  flutter_html: ^3.0.0
  
  # Environment
  flutter_dotenv: ^5.1.0
  
  # Localization
  easy_localization: ^3.0.7+1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  # Full-bleed crest; white corners removed so adaptive mask stays clean.
  image_path: "assets/icon/icon.png"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 21

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/images/hero/
    - assets/images/map/
    - assets/icon/
    - assets/translations/
    - .env


  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins/Poppins-Medium.ttf
          weight: 500
