# VPS / self-host — same stack + nginx :80/:443 + optional certbot
#   copy .env.docker.example → .env
#   set JWT_SECRET + ADMIN_PASSWORD (required)
# First boot without certs:
#   NGINX_CONFIG=prod.bootstrap.conf docker compose -f docker-compose.prod.yml up -d --build
# After certs exist:
#   NGINX_CONFIG=prod.conf docker compose -f docker-compose.prod.yml up -d

name: battleasia-prod

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - battleasia_mongo:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }",
        ]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  api:
    build:
      context: ${API_PATH:-../../battleasianew/api}
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5050
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/battleasia?replicaSet=rs0}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@battleasia.gg}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://battleasia.gg,https://www.battleasia.gg,https://shop.battleasia.gg,https://admin.battleasia.gg}
      APP_URL: ${APP_URL:-https://battleasia.gg}
      CDN_URL: ${CDN_URL:-}
      COINGO_MOCK: "false"
      LOG_AUTH_CODES: "false"
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-BattleAsia}
      SENTRY_DSN: ${SENTRY_DSN:-}
      FCM_SERVER_KEY: ${FCM_SERVER_KEY:-}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:-}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-}
      BACKUP_OFFSITE_CMD: ${BACKUP_OFFSITE_CMD:-}
    volumes:
      - api_uploads:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy

  player:
    build:
      context: .
      dockerfile: docker/player.Dockerfile
      args:
        VITE_BAC_SHOP_URL: ${VITE_BAC_SHOP_URL:-https://shop.battleasia.gg}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "80"

  shop:
    build:
      context: .
      dockerfile: docker/shop.Dockerfile
      args:
        VITE_MAIN_APP_URL: ${VITE_MAIN_APP_URL:-https://battleasia.gg}
        VITE_BAC_SHOP_URL: ${VITE_BAC_SHOP_URL:-https://shop.battleasia.gg}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "80"

  admin:
    build:
      context: .
      dockerfile: docker/admin.Dockerfile
      args:
        VITE_PLAYER_URL: ${VITE_PLAYER_URL:-https://battleasia.gg}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "80"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/${NGINX_CONFIG:-prod.bootstrap.conf}:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      - player
      - shop
      - admin
      - api

  certbot:
    image: certbot/certbot:latest
    profiles: ["ssl"]
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: /bin/sh
    command: -c "trap exit TERM; while :; do certbot renew --quiet; sleep 12h; done"

volumes:
  battleasia_mongo:
  api_uploads:
  certbot_www:
  certbot_certs:
